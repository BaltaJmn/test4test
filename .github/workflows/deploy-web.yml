name: Deploy Web

# Only the static landing page and the privacy policy: the app itself is
# Android-only, so there is nothing to build.
on:
  push:
    branches: [main]
    paths: ['web/**', 'wrangler.jsonc', '.github/workflows/deploy-web.yml']
  workflow_dispatch:  # lets you redeploy without a commit

# Never let two deploys race to the same Worker.
concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler-action trae 3.90 por defecto, y esa version exige un
          # "main": no sabe desplegar solo assets. Con 4.x el Worker sin script
          # es un deploy valido.
          wranglerVersion: "4.127.1"
          # Name, asset directory and routes all come from wrangler.jsonc.
          command: deploy
