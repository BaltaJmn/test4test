name: Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:  # lets you redeploy without a commit

# Never let two deploys race to the same Worker.
concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest  # ships the Android SDK, which configuring :shared needs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'  # matches toolchainVersion in gradle/gradle-daemon-jvm.properties

      - uses: gradle/actions/setup-gradle@v4

      # Supabase credentials replace local.properties, which is gitignored.
      - run: ./gradlew :webApp:wasmJsBrowserDistribution
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      # Source maps carry the full Kotlin source. Browsers only fetch them with
      # devtools open, so shipping them buys nothing and publishes the source.
      - run: rm -f webApp/build/dist/wasmJs/productionExecutable/*.map

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler-action trae 3.90 por defecto, y esa version exige un
          # "main": no sabe desplegar solo assets. Con 4.x el Worker sin script
          # es un deploy valido.
          wranglerVersion: "4.127.1"
          # Name, asset directory and SPA routing all come from wrangler.jsonc.
          command: deploy
