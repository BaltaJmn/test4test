name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same branch makes the running check pointless.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'  # matches toolchainVersion in gradle/gradle-daemon-jvm.properties

      # Handles the Gradle cache and wrapper validation on its own.
      - uses: gradle/actions/setup-gradle@v4

      # One invocation: Gradle configures the project once and runs all three.
      - run: ./gradlew :androidApp:assembleDebug :androidApp:lintDebug :shared:testAndroidHostTest

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
